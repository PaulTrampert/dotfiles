# Set 12-hour format for the clock
setw -g clock-mode-style 12
set -g status-right "%a %b %d %I:%M %p"

# Enable mouse support
set -g mouse on

# Share tmux clipboard with global clipboard.
set -g @clip 'if [ -n "$WAYLAND_DISPLAY" ]; then wl-copy; else xclip -selection clipboard; fi'
bind -T copy-mode MouseDragEnd1Pane send -X copy-pipe-and-cancel "#{@clip}"
bind -T copy-mode-vi MouseDragEnd1Pane send -X copy-pipe-and-cancel "#{@clip}"

# Start index for tmux windows == 1
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on

# Bind Ctrl+a as the command prefix
set -g prefix C-a
unbind C-b
bind C-a send-prefix

# Vertical split is |, horizontal is -
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
unbind '"'
unbind '%'


