# Run Baloo's indexer and content extractors without a display.
#
# kde-baloo.service starts before Plasma exports WAYLAND_DISPLAY/DISPLAY to the
# systemd user environment. Since Plasma 6.8 the extractor aborts with "no Qt
# platform plugin could be initialized" and crash-loops. It never draws
# anything, so the offscreen platform sidesteps the startup race entirely.

[Service]
Environment=QT_QPA_PLATFORM=offscreen
